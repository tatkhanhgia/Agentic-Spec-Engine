- category: ADMIN APIs
  title: Get Accounts
  after: Change User Service Plan
  method: GET
  path: /v1/admin/accounts/{pageNo}/{recordsPerPage}
  description: API is used to get accounts and filter them based on the search criteria.
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: x-user-name
    type: String
    presence: O
    description: Name of the account user to be searched
  - name: x-user-email
    type: String
    presence: O
    description: Email of the account user to be searched.
  - name: x-enterprise-name
    type: String
    presence: O
    description: Name of enterprise by which the account is to be searched.
  - name: x-billing-mode
    type: String
    presence: O
    description: Billing mode for the account, possible values are ONLINE, OFFLINE. If developers intend to ignore billing mode, it's optional.
  - name: x-payment-type
    type: String
    presence: O
    description: Payment type for the account search, possible values are PAY_REGULARLY, PAY_AS_YOU_GO.
  - name: x-service-plan
    type: String
    presence: O
    description: Name of service plan to search
  - name: x-activated
    type: String
    presence: O
    description: True, if accounts are activated.
  - name: x-enabled
    type: String
    presence: O
    description: True, if accounts are enabled.
  - name: x-from
    type: String
    presence: O
    description: Date value in ISO format from where the account is to be searched.
  - name: x-to
    type: String
    presence: O
    description: Date value in ISO format to which the account is to be searched.
  - name: x-total-records
    type: String
    presence: O
    description: Total number of records found with the provided search criteria.
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  - name: Authorization
    type: String
    presence: M
    description: 'The authentication token (accessToken) required to access the API. Must be provided in the format: Bearer {accessToken}'
  path_params:
  - name: pageNo
    type: String
    presence: M
    description: ''
  - name: recordsPerPage
    type: String
    presence: M
    description: ''
  request_fields:
  - name: pageNo
    type: Integer
    presence: O
    description: Page number, according the division of records per page
  - name: recordsPerPage
    type: Integer
    presence: O
    description: Number of records that are needed to be fetched in one request
  response_fields:
  - name: accounts
    type: List<account>
    presence: M
    description: The array of accounts
  request_example: {}
  response_example:
    accounts:
    - user_name: string
      user_email: string
      service_plan: string
      enterprise_id: 0
      enterprise_name: string
      created_on: string
