# Sections of the specification document for APIs that are designed but have
# no route in the code yet. openapi.yaml describes only what the code serves,
# so they live here; the renderer (scripts/render_from_openapi.py --planned)
# shows each one marked "(Not implemented yet)".
#
# Generated once from the approved document; edited by hand afterwards.
# When an API is implemented, describe it in openapi.yaml and delete its entry
# here: the renderer refuses an entry whose method and path the spec serves.
#
# `after` names the section the entry follows in its category; without it, or
# when no section has that title, the entry goes to the end of the category.
# `first: true` puts the entry at the start of its category instead.
# The response table's shared error rows are added by the renderer.
sections:
- category: Authenticate – Log in
  title: OTP Login Authentication
  after: Single Sign On Authentication
  method: POST
  path: /v1/authenticate/otp
  description:
  - This function retrieves an access token, which will be used in subsequent API calls.
  - GoPaperless Workflow supports two-factor authentication (2FA) using a One-Time Password (OTP) during login. To enable OTP-based authentication, the Enterprise Administrator must configure this option in the Enterprise Role settings.
  - At least one SMS provider must be configured in the GoPaperless Workflow Service to use this API.
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  request_fields:
  - name: mobile_number
    type: String
    presence: M
    description: Define the mobile number of user. The OTP will be sent to the Application.
  - name: method
    type: String
    presence: M
    description: 'Method possible values are: + SMS + EMAIL'
  response_fields:
  - name: access_token
    type: String
    presence: M
    description: The access token will be used later to connect with other APIs.
  - name: token_type
    type: String
    presence: M
    description: Type of the token returned. It is always set to “bearer”.
  - name: expires_in
    type: Integer
    presence: M
    description: Number of seconds for which this access token is valid.
  - name: refresh_token
    type: String
    presence: M
    description: This is a token related to access token. Can use this token to revoke.
  - name: refresh_token_expires_in
    type: Integer
    presence: M
    description: Number of seconds for which this refresh token is valid.
  request_example:
    mobile_number: String
    method: SMS
  response_example:
    access_token: Token
    token_type: bearer
    expires_in: 300
    refresh_token: refreshtoken
    refresh_token_expires_in: 1800
- category: Document Package
  title: Get Package Verification
  after: Get Document Verification
  method: GET
  path: /v1/packages/{packageId}/verification
  description: Business applications can use this service API to retrieve the verification results for all digital signature fields across all documents within a package.
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: Authorization
    type: String
    presence: M
    description: 'The authentication token (accessToken) required to access the API. Must be provided in the format “Bearer <accessToken>” Note: the accessToken is obtained after a successful authorization.'
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  path_params:
  - name: packageId
    type: Integer
    presence: M
    description: This is the ID of the package that was created. Using this ID to Interact with that document package.
  request_example: {}
  response_example: "[\n  {\n    \"document_id\": 1,\n    \"fields\": [\n      {\n        \"status\": \"String\",\n        \"field_name\": \"String\",\n        \"signer_name\": \"String\",\n        \"signer_photo\": \"String\",\n        \"signer_photo_url\": \"String\",\n        \"signature_status\": \"String\",\n        \"signing_reason\": \"String\",\n        \"signing_location\": \"String\",\n        \"contact_information\": \"String\",\n        \"signing_time\": \"String\",\n        \"ltv\": false,\n        \"qualified\": true,\n        \"certified\": true,\n        \"cerfify_permission\": \"String\",\n        \"timestamp_at\": \"String\",\n        \"timestamp_authority\": \"String\",\n        \"subject_dn\": \"String\",\n        \"issuer_dn\": \"String\",\n        \"cert_valid_from\": \"String\",\n        \"cert_valid_to\": \"String\",\n        \"signature_type\": \"String\",\n        \"signature_algorithm\": \"String\",\n        \"signed_hash\": \"String\",\n        \"display\": true,\n        \"page_number\": 1\n      },\n      {},..\n    ]\n  }\n  ,{},…\n]"
- category: Document Workflow
  title: Add Electronic Seal to Workflow
  after: Share Workflow
  method: POST
  path: /v1/packages/{packageId}/workflow/electronic-seals
  description: 'Business applications can use this service API to add an Electronic Seal recipient to a workflow. This call will only add a recipient to the workflow. That is, no fields currently on the document will be automatically assigned to the new Electronic Seal recipient(s), nor will this create any new fields. Note the Electronic Seal recipient(s) will be added as the last person in the workflow. Hence further work may be required to remove a current Electronic Seal recipient(s) already present in the workflow. At least one recipient must exist in a workflow before fields can be added to the document. Note: the input accepts one or more Electronic Seal recipient(s) in a single call. Note: only PDF type document is supported.'
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: Authorization
    type: String
    presence: M
    description: 'The authentication token (accessToken) required to access the API. Must be provided in the format “Bearer <accessToken>” Note: the accessToken is obtained after a successful authorization.'
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  path_params:
  - name: packageId
    type: Integer
    presence: M
    description: This is the ID of the package that was created. Using this ID to Interact with that document package.
  request_fields:
  - name: name
    type: String
    presence: M
    description: The name of the new user to be added/updated in workflow. If no value is provided, old value will be retained.
  - name: signing_order
    type: Integer
    presence: M
    description: Order in which the workflow will be signed by the recipients. This signing order is important when workflow type is set to "CUSTOM".
  response_fields:
  - name: name
    type: String
    presence: M
    description: Name
  - name: signing_order
    type: Integer
    presence: M
    description: Signing Order
  - name: level_of_assurance
    type: String
    presence: M
    description: Level of Assurance
  request_example:
    name: String
    signing_order: 0
  response_example:
    name: String
    signing_order: 0
    level_of_assurance: String
- category: Document Workflow
  title: Update Workflow Reminders
  after: Accept Terms of Service (ECONTRACT)
  method: PUT
  path: /v1/packages/{packageId}/workflow/{order}/reminders
  description:
  - Business applications can use this service API to update the workflow reminders for a recipient that has already been added to a workflow. Normally this call is useful after a template has been applied to a document and business applications want to override the reminders settings within the workflow.
  - The ID of the package is provided in the resource URL, and the workflow recipient is identified by the order at which it is added to the workflow.
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: Authorization
    type: String
    presence: M
    description: 'The authentication token (accessToken) required to access the API. Must be provided in the format “Bearer <accessToken>” Note: the accessToken is obtained after a successful authorization.'
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  path_params:
  - name: packageId
    type: Integer
    presence: M
    description: This is the ID of the package that was created. Using this ID to Interact with that document package.
  - name: order
    type: Integer
    presence: M
    description: The order of the recipient in the workflow.
  request_fields:
  - name: apply_to_all
    type: Boolean
    presence: O
    description: True, if reminder settings are to be applied on all the recipients in the workflow.
  - name: enabled
    type: Boolean
    presence: M
    description: True, if reminder settings are to be enabled.
  - name: frequency
    type: String
    presence: M
    description: Reminder Frequency. Possible Values are DAYS | HOURS.
  - name: remind_after
    type: Integer
    presence: M
    description: Required, in case of enabled property will true. The number of days after which the first reminder would be sent to workflow user.
  - name: repeat
    type: Object
    presence: O
    description: 'Settings of the subsequent reminders: enabled (Boolean) - true, if subsequent reminders are enabled; frequency (String) - repeat reminder frequency, DAYS | HOURS; keep_reminding_after (Integer) - required when enabled is true, the number of days after which the subsequent reminders would be sent to workflow user; total_reminders (Integer) - required when enabled is true, the number of subsequent reminders that would be sent to workflow user.'
  request_example:
    apply_to_all: true
    enabled: true
    frequency: DAYS
    remind_after: 1
    repeat:
      enabled: true
      frequency: DAYS
      keep_reminding_after: 1
      total_reminders: 1
  response_example: {}
- category: Document Workflow
  title: Get Workflow User Authentication (Document Opening)
  after: Delete Workflow Comment/Message
  method: GET
  path: /v1/packages/{packageId}/workflow/{order}/authentication
  description: Business Applications can use this service API to get the access security settings enabled for the package. Recipients will not be able to access document package outside the scope of this duration if the access security is enabled. Document owner can also configure authentication based security of the package for a recipient.
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: Authorization
    type: String
    presence: M
    description: 'The authentication token (accessToken) required to access the API. Must be provided in the format “Bearer <accessToken>” Note: the accessToken is obtained after a successful authorization.'
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  path_params:
  - name: packageId
    type: Integer
    presence: M
    description: This is the ID of the package that was created. Using this ID to Interact with that document package.
  - name: order
    type: Integer
    presence: M
    description: Order ID of the User
  response_fields:
  - name: authentication
    type: authentication
    presence: M
    description: Authentication object with the details of authentication methods applied on the document for the recipient.
  - name: authentication_signing
    type: authenticationSigning
    presence: M
    description: Authentication Signing for the package
  - name: access_duration
    type: accessDuration
    presence: M
    description: Access duration object with the details of access securities for the recipient.
  request_example: {}
  response_example:
    authentication:
      enabled: true
      password:
        enabled: true
      sms_otp:
        enabled: true
        otp_length: 0
        retry_duration: 0
        mobile_number: String
    authentication_signing:
      enabled: true
      sms_otp:
        otp_length: 0
        retry_duration: 0
        mobile_number: String
    access_duration:
      enabled: true
      duration_by_date:
        enabled: true
        accessible: true
        duration:
          start_date_time: String
          end_date_time: String
      duration_by_days:
        enabled: true
        accessible: true
        duration:
          total_days: 1
