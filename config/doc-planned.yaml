- category: ADMIN APIs
  title: Admin Authentication
  first: true
  method: POST
  path: /v1/admin/authenticate/client_cert
  description:
  - This API can be used to authenticate to GoPaperless Workflow Service Administrator. It requires a current, valid client TLS certificate
  - The API call should present a client TLS certificate in the HTTPS call
  headers:
  - name: x-language-name
    type: String
    presence: O
    description: 'Display the error message in the specified language. Possible values are: + en + vi'
  - name: x-password
    type: String
    presence: O
    description: Password of GoPaperless Workflow Administrator if required
  - name: Content-Type
    type: String
    presence: M
    description: The MIME type of the request body. Usually application/json
  response_fields:
  - name: access_token
    type: String
    presence: M
    description: User authentication access token – bearer token for subsequent authorisation to other API calls
  - name: token_type
    type: String
    presence: M
    description: Type of the token returned by authorization server. It is always set to “Bearer”
  - name: expires_in
    type: Integer
    presence: M
    description: Number of seconds for which this access token is valid
  request_example: {}
  response_example:
    access_token: string
    token_type: string
    expires_in: 0
