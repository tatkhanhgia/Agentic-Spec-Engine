        x-append-to-top: True if the file should be prepended to the document. Default is false
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
        documentId: The document ID is required for sharing, downloading, or appending the document to a workflow.
      description: Business applications can use this service API to merge a document at the top or the bottom of the target document in a package. The x-append-to-top header controls the position.
    Apply Workflow Template:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        Content-Type: The MIME type of the request body. Usually application/json
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
        documentId: The document ID is required for sharing, downloading, or appending the document to a workflow.
      request_fields:
        template_name: Name of template to be applied on the document.
        apply_to_all: True, if template is to be applied on all the documents in the package.
      description:
      - Business applications can use this service API to apply a workflow template to a document. The document ID on which template has to be applied is provided in the resource URL.
      - 'While applying the template it is important to remember these two important points:'
      - Point 1 - If the template being applied is created using a PDF which already contained form fields then ensure that the document on which this template is now being applied must contain these form fields in advance and GoPaperless Workflow will NOT create those form fields via the template rather only apply the form data and assign to the respective users.
      - Point 2 - If the template being applied is created where form fields are manually added (hence not present in the PDF originally) via GoPaperless Workflow e.g. signature field, initial, in-person signature, check boxes, radio buttons, text fields etc. then on applying such a template, these form fields will be created on the target document even if these form fields were already present in the document.
