# Document wording of field descriptions, per section and table.
# Generated once by scripts/extract_doc_descriptions.py from the approved
# document; edited by hand afterwards.
#
# The renderer (scripts/render_from_openapi.py --descriptions) shows the entry
# when a field has one, and the description in openapi.yaml otherwise. Delete
# an entry to hand the field back to the spec. A value is one line, or a list
# of lines shown as separate paragraphs. `[label](#Title)` links the label to
# the ENUMERATION section with that title.
sections:
  Authenticate – Log in:
    Client Credentials Authentication:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        grant_type: 'Defines the type of access token to be returned (following OAuth 2.0). Supported value: "client_credentials".'
        client_id: The Application Name that was configured in your Enterprise Account during the integration setup.
        client_secret: The API key which be generated in Enterprise Account.
        remember_me_enabled: If this parameter is true (enabled) => GoPaperless Workflow Service will return a refresh token embedded into the response. Default is false.
      response_fields:
        access_token: The access token will be used later to connect with other APIs.
        token_type: Type of the token returned. It is always set to “bearer”.
        expires_in: Number of seconds for which this access token is valid.
        refresh_token: This is a token related to access token. Can use this token to revoke.
    Password Authentication:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        grant_type:
        - 'Define which type of access token will be returned (through the OAuth 2.0):'
        - + “password”
        - + “refresh_token”
        client_id: Application Name that you have configured in your Enterprise Account when configuring the Integration options.
        client_secret: The API key which be generated in Enterprise Account.
        username: GoPaperless Workflow email address identifying the target user account - this can be an Enterprise Admin or an Enterprise User account. Note an enterprise user can use an API Key created for the enterprise by an enterprise administrator.
        password: Password for the account defined in the 'username' parameter.
        remember_me_enabled: If this parameter is true (enabled) => GoPaperless Workflow Service will return a refresh token embedded into the response. Default is false.
        scope: Used when the Enterprise Admin user is identified in 'username' and you wish to identify an Enterprise User as the target. That is, set an enterprise user as the current user for operations.
      response_fields:
        access_token: The access token will be used later to connect with other APIs.
        token_type: Type of the token returned. It is always set to “bearer”.
        expires_in: Number of seconds for which this access token is valid.
        refresh_token: This is a token related to access token. Can use this token to revoke.
    Single Sign On Authentication:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        token: 'Token obtained from 3rd party (Ex: JWT,..)'
        method:
        - 'Supported method type:'
        - + “OAUTH2”
        profile_name: Authentication profile name, required for "OAUTH2" and "OIDC"
        profile_id: Authentication profile id, Its an alternate of profile_name
      response_fields:
        access_token: The access token will be used later to connect with other APIs.
        token_type: Type of the token returned. It is always set to “bearer”.
        expires_in: Number of seconds for which this access token is valid.
        refresh_token: This is a token related to access token. Can use this token to revoke.
    Revoke refresh token:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        refresh_token: OAuth refresh access token to revoke
        token_type_hint: Type of token. Currently only “refresh_token” is supported
    Get Information:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
    Pre Login Authentication:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        email: Defines the email of the User. The service will check that email in system and return a valid data to the client.
      response_fields:
        status:
        - Status of the user. Possible values are
        - + NOT_FOUND
        - + ACTIVE
    Switch Enterprise Context:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        Content-Type: The MIME type of the request body. Usually application/json
      request_fields:
        profile_id: The ID of the enterprise profile to switch to. This parameter takes priority over enterprise_id. A positive value resolves the enterprise from the profile list of the user. A value of 0 or less switches the context back to the personal account.
        enterprise_id: The ID of the enterprise to switch to. It is an alternative to profile_id and is used only when profile_id is not provided. A value of 0 or -1 switches the context back to the personal account.
