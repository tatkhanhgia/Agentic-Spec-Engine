      description:
      - Business applications can use this service API to update a document of a document package. The document information is sent in the HTTP request header and the document content is sent as a base64 encoded string in the HTTP request body.
      - GoPaperless Workflow supports a wide variety of document formats, each of which can be converted to PDF format upon upload.
      - Note PDF documents are not altered upon upload to the system.
      - Note the document must already exist in the package before you can update it using this call.
      - Note this feature is supported only for PDF documents.
