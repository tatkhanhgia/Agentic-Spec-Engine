      request_fields:
        converter_display_name: Name shown on the conversion page as the person who converted the document. When omitted, the name of the authenticated user is used, falling back to their email address.
      description: Business applications can use this service API to produce a paper copy of a signed document. The returned PDF carries an appended conversion page that records who converted the document and a QR code linking back to the workflow.
    Download Signature Summary:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
