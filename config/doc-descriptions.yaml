    Update Document:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        x-file-name: Name of the document.
        Content-Type: Using “application/octet-stream” to upload your document with binary format.
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
        documentId: The document ID is required for sharing, downloading, or appending the document to a workflow.
      description:
      - Business applications can use this service API to update a document of a document package. The document information is sent in the HTTP request header and document bytes are sent in the HTTP request body.
      - GoPaperless Workflow supports a wide variety of document formats, each of which can be converted to PDF format upon upload.
      - Note PDF documents are not altered upon upload to the system.
      - Note the document must already exist in the package before you can update it using this call.
      - Note this feature is supported only for PDF documents.
    Update Document (base64):
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
