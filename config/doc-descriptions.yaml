      request_fields:
        package_name: Defines the name of the package.
      response_fields:
        package_id: This is the ID of the package that was created. Using this ID to Interact with that document package.
      description:
      - After authenticating into GoPaperless Workflow Service (e.g., Business Application), this mandatory function must be called first to create a package in GoPaperless Workflow.
      - This API is used to create a blank package containing one or more documents. Additionally, the package can be used to add fields, data, and other elements to initiate a new workflow.
    Upload Document:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        x-file-name: Name of the document.
        Content-Type: Using “application/octet-stream” to upload your document with binary format.
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
      response_fields:
        document_id: The document ID to be used to share, download or append it into workflow
      description: The client can use this API to add a document to a document package, which is linked to a user account. The document metadata is sent in the HTTP header, while the document data (binary) is sent in the HTTP body.
    Upload Document (base64):
      headers:
        x-language-name:
