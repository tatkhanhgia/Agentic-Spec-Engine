        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        x-file-name: Name of the document.
        Content-Type: Using “application/json” to upload your document with base64 format.
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
      request_fields:
        document: Base64 encoded of the document
      response_fields:
        document_id: The document ID to be used to share, download or append it into workflow
      description: The client can use this service API to add a document to a document package, which is linked to a user account. The document metadata is sent in the HTTP headers, while the document data (Base64-encoded) is sent in the HTTP body
    Download Package:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
      description:
      - Business applications can use this service API to download a document package in binary format. If the package contains a single document, the downloaded file will be a binary PDF. However, if the package includes multiple documents, the download will be a binary ZIP file containing all documents.
      - 'Note: The parameters x-password and x-otp are required if the package owner (the user who created the package) has enabled this option during the workflow creation phase.'
