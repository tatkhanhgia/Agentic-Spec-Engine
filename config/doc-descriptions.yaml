    role: Role of the participant. Possible values are [here](#Role)
    signing_order: Order of the recipient in the workflow. This signing order is mandatory when workflow type is "CUSTOM".
    reason: Define the reason of the participant to perform the signing process
    company_name: Name of the company
  AssignDocumentFieldRequestAssignElement:
    field_name: Name of the signature field that is to be assigned.
    order: The order of the user in workflow, to which the field is being assigned.
  WorkflowListItem:
    package_id: The ID of the package
    package_name: The name of the package
    package_owner: Defines the email of user
    owner_name: The name of the user who created this package.
    workflow_state: Overall state of the workflow
    workflow_status: Status of the Workflow based on user.
    created_at: Date of the package to know when it was workflow in ISO format
    created_by: Name of the user who created this workflow
    modified_at: Date of the package to know when it was workflow in ISO format
    modified_by: Name of the user who modified this workflow
    access_duration: The object show the duration to access to this workflow.
    decline: The object show the decline of the workflow.
    total_comments: Total comments in workflow
  AddPlaceholderRequestPlaceholder:
    placeholder: Placeholder name
