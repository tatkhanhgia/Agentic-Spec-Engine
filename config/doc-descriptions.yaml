        - 'Note: the accessToken is obtained after a successful authorization.'
      path_params:
        packageId: This is the ID of the package that was created. Using this ID to Interact with that document package.
      response_fields:
        file_data: File data in base64 format
      description:
      - Business applications can use this service API to download a document package in base64 format. If the package contains a single document, the downloaded file will be a binary PDF. However, if the package includes multiple documents, the download will be a binary ZIP file containing all documents.
      - 'Note: The parameters x-password and x-otp are required if the package owner (the user who created the package) has enabled this option during the workflow creation phase.'
    Download Document:
      headers:
