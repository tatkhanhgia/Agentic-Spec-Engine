        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
        x-search-text: The string name (after being encoded to base64) used to filter the validations by name.
        x-total-records: 'The number of records that the client wants to get. Note 1: when this parameter is defined, the parameters pageNo and recordsPerPage will be ignored. Note 2: Default value of this parameter is 100.'
      path_params:
        pageNo: Page number, according the division of records per page.
        recordsPerPage: Number of records that are needed to be fetched in one request.
      response_headers:
        x-total-records: The length of the list of records
      response_fields:
        validations: The list of validations of the current user.
      description: Business applications can use this service API to retrieve the validations of the current user. The x-search-text header can be used to filter the list by validation name. This API requires a user access token; a token obtained through Client Credentials Authentication is rejected.
    Get Report of Validation:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
        Authorization:
        - The authentication token (accessToken) required to access the API. Must be provided in the format
        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
      path_params:
        validationId: The ID of the validation returned by Add Validation.
      response_fields:
        seals: Electronic seals found in the document. Each item has the same structure as a signature.
        details: Report identifiers, document hashes and download links of the validation reports.
        file: The validated document and its diagnostic data.
      description: Business applications can use this service API to retrieve the validation report of a document. The validation ID is provided in the resource URL. While the validation is still being processed the call returns HTTP code 202; once finished it returns the full report with the overview, the validated signatures and seals, the report download links and the original document in base64 format. Only the user who created the validation can read its report. This API requires a user access token; a token obtained through Client Credentials Authentication is rejected.
    Download Reports:
      headers:
        x-language-name:
        - 'Display the error message in the specified language. Possible values are:'
        - + en
        - + vi
