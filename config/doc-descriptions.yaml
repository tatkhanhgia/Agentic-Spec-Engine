        - “Bearer <accessToken>”
        - 'Note: the accessToken is obtained after a successful authorization.'
      path_params:
        reportId: 'Identifier of the report, returned in the details links of Get Report of Validation: validation_detail_report_id for detailed and diagnostic, validation_basic_report_id for simple.'
        reportType: 'Type of the report to download. Possible values are: + detailed (detailed validation report, PDF) + diagnostic (diagnostic data, XML) + simple (simple validation report, PDF)'
      description: Business applications can use this service API to download a validation report file. The report identifier is taken from the report links returned by Get Report of Validation. The detailed report is a PDF file returned with Content-Type application/pdf; the diagnostic report is an XML file returned with Content-Type application/xml; the simple report is a PDF file that is currently returned with Content-Type application/xml and file name DiagnosticReport.pdf.
